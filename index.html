<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mats - Legal</title>
<style>
  :root {
    --brand: #1a4d8f;
    --brand-dark: #0f2f57;
    --text: #222831;
    --muted: #5a6472;
    --bg: #ffffff;
    --panel: #f7f9fc;
    --border: #e3e8ef;
    --max-width: 820px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.65;
  }
  header {
    background: var(--brand);
    color: #ffffff;
    padding: 28px 20px;
  }
  header .header-inner {
    max-width: var(--max-width);
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 40px 20px 60px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 8px;
    color: var(--brand-dark);
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 32px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .links a {
    display: block;
    padding: 18px 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--brand-dark);
    font-size: 16px;
    font-weight: 600;
  }
  .links a:hover {
    border-color: var(--brand);
  }
  .links a span {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 4px;
  }
  footer {
    text-align: center;
    padding: 24px 20px 40px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="brand">Mats</span>
  </div>
</header>

<main>
  <h1>Legal Information</h1>
  <p class="subtitle">Review our Privacy Policy and Terms &amp; Conditions below.</p>

  <div class="links">
    <a href="privacy-policy.html">
      Privacy Policy
      <span>How Mats collects, uses, and protects your information</span>
    </a>
    <a href="terms-and-conditions.html">
      Terms &amp; Conditions
      <span>The rules and responsibilities for using the Mats platform</span>
    </a>
  </div>
</main>

<footer>
  Last updated: August 2026
</footer>

</body>
</html>
